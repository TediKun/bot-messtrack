services:
  # Background Worker Service (Sangat cocok untuk Bot WhatsApp - Tidak butuh HTTP port)
  - type: worker
    name: messtrack-bot
    env: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: WA_MESS_GROUP_JID
        sync: false

